
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Aula 15 - JavaScript aplicado a Formulários</h1>
        <p>Curso: Técnico em Desenvolvimento de Sistemas</p>
        <p>Disciplina: Linguagem de Marcação / Front-End</p>
        <p>Aluno: joao felipe de lima revolta</p>
        <p>Professor(a): ____________________</p>
    </header>

    <main>
        <h2>Formulário de Cadastro</h2>

        <form onsubmit="cadastrar(event)">

            <div id="mensagem" role="alert"></div>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required
                   placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" required
                   placeholder="Digite seu e-mail">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required
                   placeholder="Digite sua senha">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" required
                   placeholder="Digite seu telefone">

            <button type="submit">Cadastrar</button>

        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
